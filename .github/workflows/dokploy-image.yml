name: Build Dokploy image

on:
  push:
    branches:
      - "release/v3.8.51"
  workflow_dispatch:

concurrency:
  group: dokploy-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build amd64 image for Dokploy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner-base
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/ibrahimabdelsattar/omniroute:dokploy
            ghcr.io/ibrahimabdelsattar/omniroute:dokploy-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/IbrahimAbdelsattar/OmniRoute
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
            OMNIROUTE_BUILD_MEMORY_MB=4096
            OMNIROUTE_BUILD_WORKERS=1
          cache-from: type=gha,scope=dokploy-amd64
          cache-to: type=gha,scope=dokploy-amd64,mode=max,ignore-error=true
